<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" role="img" aria-labelledby="title desc">
  <title id="title">API 요청 처리 흐름: 인증과 인가 두 단계</title>
  <desc id="desc">요청이 들어오면 먼저 인증(누구인가)을 확인하고, 이어서 인가(이 주문이 요청한 사람의 것인가)를 확인한 뒤 응답한다. BOLA는 인가 단계를 건너뛸 때 생긴다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- Own light card so the figure reads the same in light and dark mode -->
  <rect x="1" y="1" width="538" height="398" rx="16" fill="#ffffff" stroke="#e5e7eb" />
  <text x="24" y="40"><tspan font-size="17" font-weight="700" fill="#111827">API 요청 처리 흐름</tspan><tspan dx="10" font-size="13" fill="#6b7280">인증과 인가 두 단계</tspan></text>

  <!-- 요청 -->
  <rect x="24" y="64" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" />
  <text x="40" y="87" font-size="15" font-weight="700" fill="#111827">요청</text>
  <text x="40" y="107" class="mono" font-size="12" fill="#4b5563">GET /api/orders/10232</text>
  <line x1="144" y1="120" x2="144" y2="146" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ① 인증 -->
  <rect x="24" y="150" width="240" height="56" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="40" y="173" font-size="15" font-weight="700" fill="#312e81">① 인증</text>
  <text x="40" y="193" font-size="13" fill="#4338ca">누구인가?</text>
  <line x1="264" y1="178" x2="282" y2="178" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="288" y="183" font-size="13" fill="#6b7280">필터·미들웨어에서 한 번 설정</text>
  <line x1="144" y1="206" x2="144" y2="232" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ② 인가 -->
  <rect x="24" y="236" width="240" height="56" rx="10" fill="#4f46e5" stroke="#4338ca" />
  <text x="40" y="259" font-size="15" font-weight="700" fill="#ffffff">② 인가</text>
  <text x="40" y="279" font-size="13" fill="#e0e7ff">이 주문이 요청한 사람의 것인가?</text>
  <line x1="264" y1="264" x2="288" y2="264" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="288" y="228" width="228" height="72" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="304" y="252" font-size="14" font-weight="700" fill="#be123c">BOLA는 여기서 생긴다</text>
  <text x="304" y="272" font-size="13" fill="#4b5563">API마다 직접 챙겨야 해서</text>
  <text x="304" y="290" font-size="13" fill="#4b5563">빠뜨려도 티가 나지 않는다</text>
  <line x1="144" y1="292" x2="144" y2="318" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 응답 -->
  <rect x="24" y="322" width="240" height="56" rx="10" fill="#f3f4f6" stroke="#d1d5db" />
  <text x="40" y="345" font-size="15" font-weight="700" fill="#111827">응답</text>
  <text x="40" y="365" font-size="13" fill="#4b5563">본인 주문만 돌려준다</text>
</svg>
