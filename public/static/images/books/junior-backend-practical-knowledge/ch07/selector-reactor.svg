<svg xmlns="http://www.w3.org/2000/svg" width="900" height="635" viewBox="0 0 900 635" role="img" aria-labelledby="title desc">
<title id="title">준비 알림을 모아 처리하는 이벤트 루프</title><desc id="desc">Selector가 여러 연결의 준비 상태를 기다리고 이벤트 루프가 핸들러를 순서대로 실행한다. 긴 작업은 별도 스레드에 넘길 수 있다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="635" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><text x="32" y="48" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">준비 알림을 모아 처리하는 이벤트 루프</text><text x="32" y="85" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">여러 연결의 준비 상태를 모으고, 준비된 작업만 처리한다.</text><rect x="32" y="132" width="206" height="78" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="52" y="163" font-size="23" fill="#087e80" font-weight="600" text-anchor="start">연결 A</text><text x="52" y="193" font-size="20" fill="#087e80" font-weight="400" text-anchor="start">읽기 준비</text><path d="M238 171H282V265H312" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="226" width="206" height="78" rx="12" fill="#f5f7fa" stroke="#f5f7fa" stroke-width="2"/><text x="52" y="257" font-size="23" fill="#52657a" font-weight="600" text-anchor="start">연결 B</text><text x="52" y="287" font-size="20" fill="#52657a" font-weight="400" text-anchor="start">아직 데이터 없음</text><rect x="32" y="320" width="206" height="78" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="52" y="351" font-size="23" fill="#087e80" font-weight="600" text-anchor="start">연결 C</text><text x="52" y="381" font-size="20" fill="#087e80" font-weight="400" text-anchor="start">읽기 준비</text><path d="M238 359H282V265H312" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="320" y="202" width="204" height="127" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="422" y="245" font-size="25" fill="#235ab9" font-weight="600" text-anchor="middle">Selector</text><text x="422" y="281" font-size="21" fill="#235ab9" font-weight="400" text-anchor="middle">준비 상태 대기</text><path d="M524 265H574" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="582" y="132" width="284" height="266" rx="12" fill="#f8fafc" stroke="#d7e1ee" stroke-width="2"/><text x="724" y="172" font-size="25" fill="#172b45" font-weight="600" text-anchor="middle">이벤트 루프</text><rect x="602" y="195" width="244" height="58" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="724" y="232" font-size="22" fill="#087e80" font-weight="600" text-anchor="middle">이벤트 → 핸들러</text><text x="724" y="289" font-size="23" fill="#172b45" font-weight="400" text-anchor="middle">A 읽기 처리</text><text x="724" y="328" font-size="23" fill="#172b45" font-weight="400" text-anchor="middle">C 읽기 처리</text><text x="724" y="374" font-size="19" fill="#52657a" font-weight="400" text-anchor="middle">한 루프 안에서는 차례대로</text><path d="M724 405V465" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="748" y="441" font-size="20" fill="#52657a" font-weight="400" text-anchor="start">별도 실행</text><rect x="582" y="477" width="284" height="75" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="724" y="509" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">작업 스레드</text><text x="724" y="537" font-size="20" fill="#235ab9" font-weight="400" text-anchor="middle">긴 계산 · 블로킹 작업</text><path d="M582 516H540V377H574" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="486" y="459" font-size="20" fill="#52657a" font-weight="400" text-anchor="start">결과</text><path d="M602 132V110H422V194" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="32" y="509" font-size="23" fill="#52657a" font-weight="400" text-anchor="start">데이터가 없는 연결마다</text><text x="32" y="544" font-size="23" fill="#52657a" font-weight="400" text-anchor="start">스레드를 붙여 기다리지 않는다.</text><text x="32" y="601" font-size="23" fill="#172b45" font-weight="600" text-anchor="start">핸들러가 오래 멈추면 같은 루프의 다른 연결도 기다린다.</text></g></svg>