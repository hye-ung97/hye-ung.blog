<svg xmlns="http://www.w3.org/2000/svg" width="900" height="532" viewBox="0 0 900 532" role="img" aria-labelledby="title desc">
<title id="title">대기하는 요청과 실행하는 스레드를 분리한다</title><desc id="desc">요청 A가 I/O 대기에 들어가면 캐리어를 반환한다. 캐리어는 B와 C를 실행하고 준비된 A를 다시 실행할 수 있다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="532" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><text x="32" y="48" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">대기하는 요청과 실행하는 스레드를 분리한다</text><text x="32" y="85" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">가상 스레드 A는 기다리고, 캐리어는 다른 요청을 실행한다.</text><text x="32" y="135" font-size="22" fill="#172b45" font-weight="600" text-anchor="start">요청 A의 흐름</text><rect x="32" y="154" width="150" height="70" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="107.0" y="198" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">A 실행</text><rect x="194" y="154" width="490" height="70" rx="12" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="2"/><text x="439.0" y="198" font-size="24" fill="#52657a" font-weight="600" text-anchor="middle">A의 I/O 대기</text><rect x="696" y="154" width="170" height="70" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="781.0" y="198" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">A 실행 재개</text><path d="M182 235V278H250" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="269" y="269" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">언마운트 → 캐리어 반환</text><path d="M780 278V236" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="670" y="269" font-size="21" fill="#52657a" font-weight="400" text-anchor="end">다시 마운트</text><text x="32" y="329" font-size="22" fill="#172b45" font-weight="600" text-anchor="start">캐리어의 실행 순서 예</text><rect x="32" y="348" width="150" height="70" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="107.0" y="392" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">A 실행</text><rect x="194" y="348" width="236" height="70" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="312.0" y="392" font-size="24" fill="#087e80" font-weight="600" text-anchor="middle">B 실행</text><rect x="442" y="348" width="242" height="70" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="563.0" y="392" font-size="24" fill="#087e80" font-weight="600" text-anchor="middle">C 실행</text><rect x="696" y="348" width="170" height="70" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="781.0" y="392" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">A 실행 재개</text><text x="32" y="463" font-size="22" fill="#172b45" font-weight="500" text-anchor="start">A의 코드는 순서를 유지한다. 캐리어는 대기 중인 A에 묶이지 않는다.</text><text x="32" y="500" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">실행 재개 시에는 다른 캐리어에 올라갈 수도 있다.</text></g></svg>