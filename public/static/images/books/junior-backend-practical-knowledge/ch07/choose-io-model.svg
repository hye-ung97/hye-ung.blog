<svg xmlns="http://www.w3.org/2000/svg" width="900" height="735" viewBox="0 0 900 735" role="img" aria-labelledby="title desc">
<title id="title">병목에 맞춰 실행 방식을 고른다</title><desc id="desc">성능 문제가 없으면 구조를 유지한다. CPU와 쿼리는 원인을 개선하고 I/O 대기 요청의 스레드 비용은 가상 스레드나 논블로킹 I/O로 줄이는 방안을 검토한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="735" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><text x="32" y="48" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">병목에 맞춰 실행 방식을 고른다</text><text x="32" y="85" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">도구를 고르기 전에, 어떤 자원이 부족한지 측정한다.</text><rect x="224" y="112" width="452" height="68" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="450" y="155" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">현재 또는 예상 성능 문제가 있는가?</text><path d="M224 146H160V216" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="103" y="190" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">아니요</text><rect x="32" y="228" width="256" height="82" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="160" y="261" font-size="24" fill="#172b45" font-weight="600" text-anchor="middle">현재 구조 유지</text><text x="160" y="291" font-size="21" fill="#52657a" font-weight="400" text-anchor="middle">부하와 지표 관찰</text><path d="M676 146H700V216" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="716" y="191" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">예</text><rect x="470" y="228" width="396" height="82" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="668" y="277" font-size="25" fill="#087e80" font-weight="600" text-anchor="middle">병목이 어디인지 확인</text><path d="M550 310V337H241V360" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M730 310V360" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="372" width="418" height="104" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="241" y="413" font-size="24" fill="#172b45" font-weight="600" text-anchor="middle">CPU 계산 · 쿼리 자체가 느림</text><text x="241" y="448" font-size="22" fill="#52657a" font-weight="400" text-anchor="middle">연산·쿼리 최적화 / 자원 확장</text><rect x="470" y="372" width="396" height="104" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="668" y="413" font-size="24" fill="#087e80" font-weight="600" text-anchor="middle">I/O 대기 요청이 많아</text><text x="668" y="448" font-size="24" fill="#087e80" font-weight="600" text-anchor="middle">스레드·메모리가 부족함</text><path d="M668 476V510H241V535" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M668 476V535" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="547" width="418" height="104" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="241" y="588" font-size="25" fill="#235ab9" font-weight="600" text-anchor="middle">가상 스레드 검토</text><text x="241" y="623" font-size="21" fill="#235ab9" font-weight="400" text-anchor="middle">기존 순차 코드의 변경을 줄일 때</text><rect x="470" y="547" width="396" height="104" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="668" y="588" font-size="25" fill="#235ab9" font-weight="600" text-anchor="middle">논블로킹 I/O 검토</text><text x="668" y="623" font-size="21" fill="#235ab9" font-weight="400" text-anchor="middle">이벤트 기반 구조를 적용할 때</text><text x="32" y="701" font-size="23" fill="#172b45" font-weight="600" text-anchor="start">변경 여력과 호환성을 확인하고, 같은 부하에서 효과를 비교한다.</text></g></svg>