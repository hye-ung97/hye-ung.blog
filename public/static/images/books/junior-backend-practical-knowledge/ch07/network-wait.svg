<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">I/O를 기다리는 동안 무엇이 묶일까?</title><desc id="desc">서버가 DB, Redis, 외부 API와 통신한다. 요청 A 담당 스레드는 I/O 응답을 기다리지만 다른 스레드는 CPU를 사용할 수 있다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="660" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><text x="32" y="48" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">I/O를 기다리는 동안 무엇이 묶일까?</text><text x="32" y="85" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">요청의 스레드는 기다려도, 다른 스레드는 CPU를 사용할 수 있다.</text><rect x="32" y="166" width="190" height="70" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="127" y="210" font-size="24" fill="#235ab9" font-weight="600" text-anchor="middle">클라이언트</text><path d="M222 201H302" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="310" y="166" width="230" height="70" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="425" y="210" font-size="24" fill="#087e80" font-weight="600" text-anchor="middle">애플리케이션</text><path d="M540 201H590V139H656" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="664" y="112" width="202" height="54" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="765" y="148" font-size="23" fill="#172b45" font-weight="500" text-anchor="middle">DB</text><path d="M540 201H590V223H656" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="664" y="196" width="202" height="54" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="765" y="232" font-size="23" fill="#172b45" font-weight="500" text-anchor="middle">Redis</text><path d="M540 201H590V307H656" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="664" y="280" width="202" height="54" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="765" y="316" font-size="23" fill="#172b45" font-weight="500" text-anchor="middle">외부 API</text><text x="32" y="382" font-size="22" fill="#52657a" font-weight="600" text-anchor="start">요청 A 담당 스레드</text><rect x="32" y="401" width="154" height="63" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="109.0" y="441" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">코드 실행</text><rect x="198" y="401" width="502" height="63" rx="12" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="2"/><text x="449.0" y="441" font-size="23" fill="#52657a" font-weight="600" text-anchor="middle">I/O 응답 대기</text><rect x="712" y="401" width="154" height="63" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="789.0" y="441" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">코드 실행</text><text x="32" y="507" font-size="22" fill="#52657a" font-weight="600" text-anchor="start">CPU가 실행할 수 있는 다른 작업</text><rect x="198" y="525" width="502" height="60" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="2"/><text x="449" y="564" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">다른 실행 가능한 스레드의 코드</text><text x="32" y="627" font-size="23" fill="#172b45" font-weight="500" text-anchor="start">대기 요청에도 플랫폼 스레드의 스택과 풀의 자리는 필요하다.</text></g></svg>