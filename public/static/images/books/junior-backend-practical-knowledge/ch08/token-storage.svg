<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">사용자 식별 정보를 어디에 보관할까?</title><desc id="desc">서버 저장 방식은 임의 토큰으로 공유 저장소의 사용자 정보를 조회한다. JWT 방식은 서버가 서명과 유효성을 검증한 뒤 토큰에 담긴 사용자 식별자를 구한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="500" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">사용자 식별 정보를 어디에 보관할까?</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">어느 방식이든 서버가 토큰을 검증한 뒤 사용자를 식별한다.</text><text x="32" y="139" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">서버 저장 방식</text><rect x="32" y="165" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="200" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">클라이언트</text><text x="137" y="232" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">임의 토큰</text><rect x="350" y="165" width="200" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="450" y="200" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">서버</text><text x="450" y="232" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">저장소 조회</text><rect x="658" y="165" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="200" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">공유 저장소</text><text x="763" y="232" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">토큰 → 사용자</text><path d="M242 211H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 211H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="321" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">토큰에 정보를 담는 방식</text><rect x="32" y="347" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="382" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">클라이언트</text><text x="137" y="414" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">서명된 JWT</text><rect x="350" y="347" width="200" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="450" y="382" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">서버</text><text x="450" y="414" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">서명 · 유효성 검증</text><rect x="658" y="347" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="382" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">검증한 토큰</text><text x="763" y="414" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">사용자 식별자</text><path d="M242 393H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 393H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="477" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">토큰 발급 이후의 만료와 무효화 정책도 함께 정한다.</text>
</g></svg>
