<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
<title id="title">민감 정보는 API 응답을 만들 때부터 가린다</title><desc id="desc">서버가 사용자 권한을 확인하고 필요한 데이터만 마스킹해 응답한다. 클라이언트에는 이미 마스킹한 데이터가 전달된다. 화면에서만 가리면 API 응답에 원문이 남는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="410" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">민감 정보는 API 응답을 만들 때부터 가린다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">브라우저에 원문을 보낸 다음 화면에서만 가리지 않는다.</text><rect x="32" y="160" width="210" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="137" y="195" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">민감 원본</text><text x="137" y="227" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">서버가 보관하는 정보</text><rect x="350" y="160" width="210" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="455" y="195" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">서버</text><text x="455" y="227" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">권한 확인 · 마스킹</text><rect x="666" y="160" width="202" height="100" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="767" y="195" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">클라이언트</text><text x="767" y="227" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">가려진 값 표시</text><path d="M242 210H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 210H658" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="611" y="143" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">가려진 응답</text><text x="450" y="326" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">응답 예: {"phone":"010-****-2468"}</text><text x="450" y="377" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">화면에서만 가리면 API 응답에 원문이 남는다.</text>
</g></svg>
