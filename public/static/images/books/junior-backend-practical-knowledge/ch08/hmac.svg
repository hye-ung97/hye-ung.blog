<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">HMAC은 공유 비밀 키로 메시지를 검증한다</title><desc id="desc">송신자가 메시지와 공유 비밀 키로 MAC을 계산해 메시지와 함께 보낸다. 수신자는 같은 메시지와 키로 MAC을 다시 계산하고 받은 MAC과 비교한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="570" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">HMAC은 공유 비밀 키로 메시지를 검증한다</text>
<rect x="32" y="132" width="290" height="94" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="177" y="167" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">송신자</text><text x="177" y="199" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">메시지 + 공유 비밀 키</text><rect x="578" y="132" width="290" height="94" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="723" y="167" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">수신자</text><text x="723" y="199" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">받은 메시지 + 같은 키</text><path d="M177 226V302" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="177" y="274" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">HMAC 계산</text><rect x="32" y="310" width="290" height="84" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="177" y="360" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">MAC A</text><path d="M322 352H450V179H570" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="113" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">메시지 + MAC A 전송</text><path d="M723 226V302" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="723" y="274" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">HMAC 재계산</text><rect x="578" y="310" width="290" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="723" y="360" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">MAC B</text><path d="M177 394V462H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M723 394V462H558" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="422" width="200" height="80" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="450" y="470" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">A와 B 비교</text><text x="450" y="544" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">같은 메시지와 같은 비밀 키를 사용했는지 확인한다.</text>
</g></svg>
