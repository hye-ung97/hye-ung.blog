<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">복원이 필요한 정보는 키로 암호화한다</title><desc id="desc">대칭 키 암호화는 같은 비밀 키로 암호화하고 복호화한다. 공개 키 암호화는 수신자의 공개 키로 암호화하고 수신자의 개인 키로 복호화한다. 전자서명과는 구분한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="560" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">복원이 필요한 정보는 키로 암호화한다</text>
<text x="32" y="126" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">대칭 키: 같은 비밀 키로 암호화와 복호화</text><rect x="32" y="180" width="148" height="84" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="106" y="230" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">원문</text><rect x="365" y="180" width="170" height="84" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="230" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">암호문</text><rect x="690" y="180" width="178" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="779" y="230" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">복원한 원문</text><path d="M180 222H357" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535 222H682" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="273" y="168" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">비밀 키로 암호화</text><text x="613" y="168" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">같은 키로 복호화</text><text x="32" y="337" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">공개 키: 수신자의 공개 키와 개인 키 사용</text><rect x="32" y="390" width="148" height="84" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="106" y="440" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">원문</text><rect x="365" y="390" width="170" height="84" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="440" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">암호문</text><rect x="690" y="390" width="178" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="779" y="440" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">복원한 원문</text><path d="M180 432H357" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M535 432H682" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="273" y="378" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">수신자 공개 키</text><text x="613" y="378" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">수신자 개인 키</text><text x="450" y="531" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">전자서명은 개인 키로 서명하고 공개 키로 검증하는 별도의 연산이다.</text>
</g></svg>
