<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">로그인한 사용자라도 권한은 따로 확인한다</title><desc id="desc">서버가 인증한 사용자 정보를 기준으로 기능 실행 권한과 해당 예약에 대한 접근 권한을 검사한다. 모든 검사를 통과한 요청만 업무를 처리한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="450" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">로그인한 사용자라도 권한은 따로 확인한다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">요청 파라미터의 사용자 ID를 그대로 신뢰하지 않는다.</text><rect x="32" y="159" width="210" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="194" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">인증된 사용자</text><text x="137" y="226" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">서버가 확인한 주체</text><rect x="344" y="125" width="230" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="459" y="160" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">기능 권한 검사</text><text x="459" y="192" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">기능 실행이 가능한가?</text><rect x="344" y="295" width="230" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="459" y="330" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">자원 권한 검사</text><text x="459" y="362" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">접근 가능한 예약인가?</text><rect x="660" y="295" width="208" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="764" y="330" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">업무 처리</text><text x="764" y="362" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">검사를 통과한 요청</text><path d="M242 209H290V171H336" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M459 217V287" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="504" y="259" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">통과</text><path d="M574 341H652" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="613" y="319" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">통과</text><text x="32" y="415" font-size="22" fill="#52657a" text-anchor="start" font-weight="400">검사에 실패하면 요청을 거부한다.</text>
</g></svg>
