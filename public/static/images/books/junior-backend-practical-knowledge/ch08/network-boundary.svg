<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
<title id="title">네트워크 경계에서도 필요한 연결만 허용한다</title><desc id="desc">방화벽은 출발지와 목적지, 포트 등의 정책으로 연결을 제한한다. 서비스 HTTPS는 외부에 열되 관리 기능은 허용한 대역으로 제한하고 나머지는 차단한다. 아웃바운드도 필요한 목적지만 허용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="530" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">네트워크 경계에서도 필요한 연결만 허용한다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">서비스와 관리 기능에 서로 다른 접근 정책을 적용한다.</text><rect x="32" y="132" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="167" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">일반 사용자</text><text x="137" y="199" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">서비스 접근</text><rect x="32" y="280" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="315" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">관리 허용 대역</text><text x="137" y="347" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">관리 기능 접근</text><rect x="350" y="188" width="208" height="132" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="454" y="223" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">방화벽 정책</text><text x="454" y="255" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">IP · 포트 정책</text><rect x="658" y="132" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="167" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">서비스 HTTPS</text><text x="763" y="199" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">필요한 포트만</text><rect x="658" y="280" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="315" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">관리 기능</text><text x="763" y="347" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">허용 대역만</text><path d="M242 178H294V224H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M242 326H294V286H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M558 224H606V178H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M558 286H606V326H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="409" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">정책에 맞지 않는 연결은 차단한다.</text><rect x="32" y="437" width="836" height="66" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="450" y="478" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">아웃바운드도 필요한 목적지로 제한한다</text>
</g></svg>
