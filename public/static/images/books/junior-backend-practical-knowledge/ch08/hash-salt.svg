<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">같은 비밀번호도 솔트가 다르면 저장값이 달라진다</title><desc id="desc">같은 원문이라도 서로 다른 솔트로 해시를 계산하면 서로 다른 저장값을 얻는다. 로그인 검증에는 저장된 솔트와 같은 알고리즘 설정을 사용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="480" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">같은 비밀번호도 솔트가 다르면 저장값이 달라진다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">같은 원문을 서로 다른 솔트와 함께 처리한 개념도다.</text><rect x="32" y="142" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="177" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">같은 비밀번호</text><text x="137" y="209" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">입력 원문</text><rect x="342" y="142" width="218" height="92" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="451" y="177" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">단방향 변환</text><text x="451" y="209" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">솔트 A 사용</text><rect x="660" y="142" width="208" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="764" y="196" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">저장값 A</text><path d="M242 188H334" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 188H652" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="286" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="321" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">같은 비밀번호</text><text x="137" y="353" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">입력 원문</text><rect x="342" y="286" width="218" height="92" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="451" y="321" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">단방향 변환</text><text x="451" y="353" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">솔트 B 사용</text><rect x="660" y="286" width="208" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="764" y="340" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">저장값 B</text><path d="M242 332H334" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 332H652" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="422" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">솔트는 해시 및 알고리즘 설정과 함께 보관한다.</text><text x="450" y="455" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">로그인 시에는 저장된 조건으로 입력한 비밀번호를 검증한다.</text>
</g></svg>
