<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title description">
  <title id="title">회원과 상품 사이의 추천 관계</title>
  <desc id="description">회원 1은 상품 1에 연결되고, 회원 2는 상품 1과 상품 2에 연결된다. 모든 엣지는 추천 관계다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#52657a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="342" rx="18" fill="#fff" stroke="#dbe4ef" stroke-width="2"/>
  <g fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M221 99H527"/>
    <path d="M221 239L527 117"/>
    <path d="M221 247H527"/>
  </g>
  <g fill="#eaf1fb" stroke="#426a9e" stroke-width="2.5">
    <rect x="55" y="61" width="156" height="76" rx="20"/>
    <rect x="55" y="209" width="156" height="76" rx="20"/>
  </g>
  <g fill="#e6f4f4" stroke="#087e80" stroke-width="2.5">
    <rect x="549" y="61" width="156" height="76" rx="20"/>
    <rect x="549" y="209" width="156" height="76" rx="20"/>
  </g>
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" text-anchor="middle">
    <g font-size="32" font-weight="700" fill="#172b45">
      <text x="133" y="110">회원 1</text>
      <text x="133" y="258">회원 2</text>
      <text x="627" y="110">상품 1</text>
      <text x="627" y="258">상품 2</text>
    </g>
    <g font-size="26" fill="#52657a">
      <text x="378" y="82">추천</text>
      <text x="373" y="161">추천</text>
      <text x="378" y="279">추천</text>
    </g>
  </g>
</svg>
