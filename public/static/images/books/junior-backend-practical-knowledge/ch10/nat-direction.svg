<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">SNAT는 출발지, DNAT는 목적지를 바꾼다</title><desc id="desc">나가는 요청은 출발지 사설 IP 10.20.0.15가 공인 IP 198.51.100.10으로 바뀐다. 들어오는 요청은 목적지 공인 IP 198.51.100.10이 서버의 사설 IP 10.30.0.20으로 바뀐다. IP 주소 변환에 집중한 예다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="640" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">SNAT는 출발지, DNAT는 목적지를 바꾼다</text>
<text x="32" y="120" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">SNAT: 내부에서 외부로 나가는 요청</text><rect x="32" y="150" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="185" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">내부 클라이언트</text><text x="137" y="217" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">10.20.0.15</text><rect x="350" y="150" width="200" height="92" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="185" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">NAT 장비</text><text x="450" y="217" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">출발지 주소 변환</text><rect x="658" y="150" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="185" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">외부 API</text><text x="763" y="217" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">203.0.113.80</text><path d="M242 196H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 196H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="282" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">출발지: 10.20.0.15 → 198.51.100.10</text><text x="32" y="352" font-size="24" fill="#172b45" text-anchor="start" font-weight="600">DNAT: 외부에서 내부 서버로 들어오는 요청</text><rect x="32" y="382" width="210" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="417" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">외부 클라이언트</text><text x="137" y="449" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">공인 주소로 요청</text><rect x="350" y="382" width="200" height="92" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="417" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">NAT 장비</text><text x="450" y="449" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">목적지 주소 변환</text><rect x="658" y="382" width="210" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="763" y="417" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">내부 서버</text><text x="763" y="449" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">10.30.0.20</text><path d="M242 428H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 428H650" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="514" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">목적지: 198.51.100.10 → 10.30.0.20</text><text x="450" y="581" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">접속 허용 목록에는 상대가 보는 출발지 IP를 전달한다.</text><text x="450" y="613" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">입구와 출구의 공인 IP는 구성에 따라 다를 수 있다.</text>
</g></svg>
