<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title desc">
<title id="title">HTTP/3는 QUIC 위에서 동작한다</title><desc id="desc">TCP 기반 HTTPS는 HTTP, TLS, TCP, IP로 구성된다. HTTP/3는 TLS를 통합한 QUIC을 사용하고 QUIC은 UDP 위에서 연결과 신뢰성 등을 제공한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="565" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">HTTP/3는 QUIC 위에서 동작한다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">QUIC은 UDP 위에서 연결·재전송·암호화 등을 제공한다.</text><text x="227" y="137" font-size="24" fill="#172b45" text-anchor="middle" font-weight="600">TCP 기반 HTTPS</text><text x="673" y="137" font-size="24" fill="#172b45" text-anchor="middle" font-weight="600">QUIC 기반 HTTP/3</text><rect x="56" y="165" width="342" height="64" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="227" y="205" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">HTTP/1.1 · HTTP/2</text><rect x="502" y="165" width="342" height="64" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="673" y="205" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">HTTP/3</text><path d="M227 229V247" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M673 229V247" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="255" width="342" height="64" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="227" y="295" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">TLS</text><rect x="502" y="255" width="342" height="64" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="673" y="295" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">QUIC (TLS 통합)</text><path d="M227 319V337" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M673 319V337" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="345" width="342" height="64" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="227" y="385" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">TCP</text><rect x="502" y="345" width="342" height="64" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="673" y="385" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">UDP</text><path d="M227 409V427" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M673 409V427" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="56" y="435" width="342" height="64" rx="13" fill="#f5f7fa" stroke="#cbd7e5"/><text x="227" y="475" font-size="25" fill="#52657a" text-anchor="middle" font-weight="600">IP</text><rect x="502" y="435" width="342" height="64" rx="13" fill="#f5f7fa" stroke="#cbd7e5"/><text x="673" y="475" font-size="25" fill="#52657a" text-anchor="middle" font-weight="600">IP</text><text x="450" y="540" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">전송 프로토콜만으로 실제 응답 속도를 단정하지 않는다.</text>
</g></svg>
