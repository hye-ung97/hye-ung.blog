<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">이름으로 주소를 조회하고 그 주소로 접속한다</title><desc id="desc">클라이언트가 api.example.test의 주소를 조회한다. DNS 조회 결과로 두 주소를 받고 그중 198.51.100.20으로 접속하는 예다. 실제 조회 결과가 아닌 설명용 주소다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="550" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">이름으로 주소를 조회하고 그 주소로 접속한다</text>
<rect x="56" y="125" width="200" height="92" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="156" y="160" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">클라이언트</text><text x="156" y="192" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">이름으로 접속</text><rect x="350" y="125" width="200" height="92" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="160" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">DNS 조회</text><text x="450" y="192" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">주소 정보 응답</text><rect x="650" y="125" width="218" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="759" y="160" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">API 서버</text><text x="759" y="192" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">198.51.100.20</text><path d="M156 217V475M450 217V475M759 217V475" stroke="#cbd7e5" stroke-width="2" stroke-dasharray="7 5"/><path d="M156 265H442" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="246" font-size="20" fill="#52657a" text-anchor="start" font-weight="400">① api.example.test 주소 문의</text><path d="M450 345H164" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="302" y="325" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">② .20과 .21 주소 응답</text><path d="M156 435H751" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="415" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">③ 받은 주소 중 198.51.100.20으로 접속</text><text x="450" y="510" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">예시 응답: 198.51.100.20 / 198.51.100.21</text><text x="450" y="538" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">실측값이 아닌 설명용 도메인과 주소다.</text>
</g></svg>
