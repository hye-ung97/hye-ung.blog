<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">VPN으로 허용된 내부 네트워크에 접근한다</title><desc id="desc">원격 개발자의 VPN 클라이언트가 인터넷 구간의 암호화 터널을 통해 VPN 게이트웨이에 접속한다. 내부 서버와 DB 중 권한과 네트워크 정책으로 허용된 자원만 사용한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="480" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">VPN으로 허용된 내부 네트워크에 접근한다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">외부 접속에 필요한 VPN 클라이언트와 게이트웨이를 구성한다.</text><rect x="620" y="122" width="264" height="294" rx="14" fill="#f8fafc" stroke="#cbd7e5" stroke-dasharray="7 5"/><text x="752" y="152" font-size="22" fill="#52657a" text-anchor="middle" font-weight="600">서버 네트워크</text><rect x="32" y="245" width="210" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="280" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">원격 개발자</text><text x="137" y="312" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">VPN 클라이언트</text><rect x="350" y="245" width="218" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="459" y="280" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">VPN 게이트웨이</text><text x="459" y="312" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">인증 · 연결 제어</text><rect x="646" y="180" width="212" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="752" y="215" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">내부 서버</text><text x="752" y="247" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">SSH 등 허용된 연결</text><rect x="646" y="310" width="212" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="752" y="345" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">내부 DB</text><text x="752" y="377" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">허용된 DB 연결</text><path d="M242 295H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="296" y="228" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">암호화 터널</text><path d="M568 295H606V226H638" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M606 295V356H638" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="456" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">VPN 연결 후에도 자원별 권한과 방화벽 정책을 확인한다.</text>
</g></svg>
