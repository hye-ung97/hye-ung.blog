<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">TCP는 세 단계로 연결을 설정한다</title><desc id="desc">일반적인 TCP 연결 설정에서 클라이언트가 SYN을 보내고 서버가 SYN-ACK으로 응답한다. 클라이언트가 ACK을 보내 연결을 설정한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="500" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">TCP는 세 단계로 연결을 설정한다</text>
<rect x="96" y="120" width="220" height="84" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="206" y="170" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">클라이언트</text><rect x="576" y="120" width="220" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="686" y="170" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">서버</text><path d="M206 204V445M686 204V445" stroke="#cbd7e5" stroke-width="2"/><path d="M206 255H678" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="446" y="236" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">① SYN</text><path d="M686 335H214" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="446" y="316" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">② SYN-ACK</text><path d="M206 415H678" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="446" y="396" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">③ ACK</text><text x="450" y="477" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">일반적인 TCP 연결 설정의 세 단계다.</text>
</g></svg>
