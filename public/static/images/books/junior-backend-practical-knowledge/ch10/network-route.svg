<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 네트워크는 라우터를 거친다</title><desc id="desc">사무실 노드가 사무실 경계 라우터와 중간 라우터, 서버 측 라우터를 거쳐 서버에 데이터를 보낸다. 라우터는 목적지 주소를 보고 다음 전달 경로를 선택한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="460" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">서로 다른 네트워크는 라우터를 거친다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">라우터는 목적지 주소를 보고 다음 전달 경로를 선택한다.</text><rect x="32" y="112" width="278" height="294" rx="14" fill="#f8fafc" stroke="#cbd7e5" stroke-dasharray="7 5"/><text x="171" y="142" font-size="22" fill="#52657a" text-anchor="middle" font-weight="600">사무실 네트워크</text><rect x="590" y="112" width="278" height="294" rx="14" fill="#f8fafc" stroke="#cbd7e5" stroke-dasharray="7 5"/><text x="729" y="142" font-size="22" fill="#52657a" text-anchor="middle" font-weight="600">서버 네트워크</text><rect x="66" y="165" width="210" height="82" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="171" y="200" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">클라이언트 노드</text><text x="171" y="232" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">노트북</text><rect x="66" y="298" width="210" height="82" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="171" y="333" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">경계 라우터</text><text x="171" y="365" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">사무실 망의 경계</text><rect x="360" y="228" width="180" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="450" y="263" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">중간 라우터</text><text x="450" y="295" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">다음 경로 선택</text><rect x="624" y="165" width="210" height="82" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="729" y="200" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">서버 측 라우터</text><text x="729" y="232" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">서버 망의 경계</text><rect x="624" y="298" width="210" height="82" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="729" y="333" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">서버 노드</text><text x="729" y="365" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">API 처리</text><path d="M171 247V290" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M276 339H324V274H352" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 274H570V206H616" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M729 247V290" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="438" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">통신 경로에는 여러 라우터가 있을 수 있다.</text>
</g></svg>
