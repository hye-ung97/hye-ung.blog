<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" role="img" aria-labelledby="title desc">
<title id="title">요청 데이터가 공유 필드에 남아 있을 때</title><desc id="desc">요청 A가 공유 필드에 결제 ID 1을 넣은 뒤 B가 2로 바꾸면, A는 결과를 ID 2에 저장하게 된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="574" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">요청 데이터가 공유 필드에 남아 있을 때</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">하나의 서비스 객체를 여러 요청이 함께 사용하는 상황</text>
<rect x="32" y="124" width="260" height="64" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="162.0" y="164.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">A: payId = 1</text><rect x="608" y="124" width="260" height="64" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="738.0" y="164.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">B: payId = 2</text><path d="M292 156 L361 217" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><path d="M608 156 L541 217" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="257" y="227" width="386" height="90" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="450.0" y="264.0" font-size="23" fill="#172b45" font-weight="600" text-anchor="middle">공유 PayService</text><text x="450.0" y="296.0" font-size="23" fill="#172b45" font-weight="600" text-anchor="middle">필드 payId: 1 → 2</text><path d="M450 317 L450 365" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="162" y="379" width="576" height="86" rx="12" fill="#fff0f1" stroke="#f0ccd0" stroke-width="2"/><text x="450.0" y="414.0" font-size="23" fill="#ad3c48" font-weight="600" text-anchor="middle">A가 응답을 저장할 때도 payId는 2</text><text x="450.0" y="446.0" font-size="23" fill="#ad3c48" font-weight="600" text-anchor="middle">A의 결제 결과가 B의 데이터에 반영됨</text><rect x="32" y="490" width="836" height="60" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="527" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">요청마다 달라지는 결제 ID를 공유 필드 하나에 저장해 생긴 문제다.</text></g></svg>