<svg xmlns="http://www.w3.org/2000/svg" width="900" height="554" viewBox="0 0 900 554" role="img" aria-labelledby="title desc">
<title id="title">서로가 가진 잠금을 기다리는 교착 상태</title><desc id="desc">첫 번째는 A를 가진 스레드 1과 B를 가진 스레드 2가 서로 기다리는 순환이다. 두 번째는 모두 A, B 순서로 획득해 순환 대기를 피하는 흐름이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="554" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">서로가 가진 잠금을 기다리는 교착 상태</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">두 자원의 잠금이 필요하면 모든 경로의 획득 순서를 맞춘다</text>
<text x="32" y="134" font-size="25" fill="#ad3c48" font-weight="600" text-anchor="start">서로 다른 순서로 획득</text><rect x="32" y="155" width="300" height="67" rx="12" fill="#fff0f1" stroke="#f0ccd0" stroke-width="2"/><text x="182.0" y="196.5" font-size="23" fill="#ad3c48" font-weight="600" text-anchor="middle">스레드 1 · A 보유</text><rect x="568" y="155" width="300" height="67" rx="12" fill="#fff0f1" stroke="#f0ccd0" stroke-width="2"/><text x="718.0" y="196.5" font-size="23" fill="#ad3c48" font-weight="600" text-anchor="middle">스레드 2 · B 보유</text><path d="M332 179 L558 179" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="163" font-size="21" fill="#ad3c48" font-weight="500" text-anchor="middle">B를 기다림</text><path d="M568 214 L342 214" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="246" font-size="21" fill="#ad3c48" font-weight="500" text-anchor="middle">A를 기다림</text><path d="M32 284 L868 284" fill="none" stroke="#d7e1ee" stroke-width="3"/><text x="32" y="329" font-size="25" fill="#235ab9" font-weight="600" text-anchor="start">모두 A → B 순서로 획득</text><rect x="32" y="351" width="390" height="93" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="227.0" y="389.5" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">스레드 1 · A 획득 후 B 획득</text><text x="227.0" y="421.5" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">처리 후 B와 A 반환</text><rect x="478" y="351" width="390" height="93" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="673.0" y="389.5" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">스레드 2 · A에서 대기</text><text x="673.0" y="421.5" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">스레드 1이 끝나면 A → B 획득</text><rect x="32" y="470" width="836" height="60" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="507" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">잠금을 얻는 순서를 통일하고, 획득 대기 시간도 제한한다.</text></g></svg>