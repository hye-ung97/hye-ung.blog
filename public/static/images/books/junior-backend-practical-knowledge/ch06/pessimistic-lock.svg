<svg xmlns="http://www.w3.org/2000/svg" width="900" height="584" viewBox="0 0 900 584" role="img" aria-labelledby="title desc">
<title id="title">먼저 잠근 트랜잭션이 판단과 변경을 마친다</title><desc id="desc">배송 시작이 먼저 행 잠금을 얻고 배송 중으로 바꾼다. 대기하던 주문 취소는 잠금 획득 후 배송 중 상태를 확인하고 취소를 거절한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="584" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">먼저 잠근 트랜잭션이 판단과 변경을 마친다</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">배송이 먼저 시작된 경우</text>
<text x="42" y="135" font-size="20" fill="#52657a" font-weight="400" text-anchor="start">시간 ↓</text><text x="170" y="135" font-size="25" fill="#235ab9" font-weight="600" text-anchor="start">배송 시작 트랜잭션</text><text x="532" y="135" font-size="25" fill="#087e80" font-weight="600" text-anchor="start">주문 취소 트랜잭션</text><rect x="145" y="159" width="340" height="317" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><rect x="513" y="159" width="340" height="317" rx="12" fill="#e9f7f5" stroke="#e9f7f5" stroke-width="2"/><text x="315" y="202" font-size="21" fill="#235ab9" font-weight="600" text-anchor="middle">FOR UPDATE · 잠금 획득</text><text x="315" y="253" font-size="21" fill="#235ab9" font-weight="600" text-anchor="middle">주문 상태 확인</text><text x="315" y="304" font-size="21" fill="#235ab9" font-weight="600" text-anchor="middle">배송 중으로 변경</text><text x="315" y="355" font-size="21" fill="#235ab9" font-weight="600" text-anchor="middle">COMMIT · 잠금 반환</text><text x="683" y="202" font-size="22" fill="#087e80" font-weight="600" text-anchor="middle">FOR UPDATE 시도</text><path d="M682 220 L682 336" fill="none" stroke="#52657a" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="704" y="280" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">대기</text><path d="M485 355 L530 355" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><text x="683" y="376" font-size="21" fill="#087e80" font-weight="600" text-anchor="middle">잠금 획득 후 상태 조회</text><text x="683" y="413" font-size="21" fill="#087e80" font-weight="600" text-anchor="middle">배송 중이므로 취소 거절</text><text x="683" y="451" font-size="21" fill="#087e80" font-weight="600" text-anchor="middle">ROLLBACK · 잠금 반환</text><rect x="32" y="500" width="836" height="60" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="537" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">조회 → 판단 → 변경이 같은 트랜잭션과 잠금 범위에 들어간다.</text></g></svg>