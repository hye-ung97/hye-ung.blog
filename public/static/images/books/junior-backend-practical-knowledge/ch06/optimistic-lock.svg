<svg xmlns="http://www.w3.org/2000/svg" width="900" height="591" viewBox="0 0 900 591" role="img" aria-labelledby="title desc">
<title id="title">조회한 버전으로 변경 조건을 건다</title><desc id="desc">A와 B가 버전 1을 읽고 버전 1인 행을 버전 2로 갱신한다. A가 먼저 성공하면 B는 조건이 맞지 않아 변경 행 수가 0이 된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="591" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">조회한 버전으로 변경 조건을 건다</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">명시적인 선점 잠금 없이 충돌을 확인하는 방식</text>
<rect x="32" y="121" width="836" height="64" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="450.0" y="161.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">두 요청 모두 version = 1인 주문을 읽음</text><path d="M450 185 L450 220" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="237" width="401" height="216" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><rect x="467" y="237" width="401" height="216" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="56" y="277" font-size="25" fill="#235ab9" font-weight="600" text-anchor="start">A · 먼저 갱신</text><text x="491" y="277" font-size="25" fill="#087e80" font-weight="600" text-anchor="start">B · 뒤늦게 갱신</text><text x="56" y="324" font-size="23" fill="#235ab9" font-weight="400" text-anchor="start">WHERE version = 1</text><text x="56" y="361" font-size="23" fill="#235ab9" font-weight="400" text-anchor="start">SET version = 2</text><text x="491" y="324" font-size="23" fill="#087e80" font-weight="400" text-anchor="start">WHERE version = 1</text><text x="491" y="361" font-size="23" fill="#087e80" font-weight="400" text-anchor="start">SET version = 2</text><text x="56" y="416" font-size="25" fill="#235ab9" font-weight="700" text-anchor="start">변경 1행 → 커밋</text><text x="491" y="416" font-size="25" fill="#ad3c48" font-weight="700" text-anchor="start">변경 0행 → 롤백</text><rect x="32" y="479" width="836" height="88" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="516" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">B의 조건에 맞는 행이 없다. A가 버전을 이미 2로 바꿨기 때문이다.</text><text x="54" y="548" font-size="21" fill="#235ab9" font-weight="400" text-anchor="start">조회한 버전을 WHERE 조건으로 비교하고, 변경 행 수로 충돌을 확인한다.</text></g></svg>