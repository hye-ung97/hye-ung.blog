<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528" role="img" aria-labelledby="title desc">
<title id="title">상태 변경을 하나의 스레드에 모은다</title><desc id="desc">여러 요청 스레드는 작업 큐에 요청을 넣는다. 상태 관리 스레드 하나만 큐에서 작업을 꺼내 상태를 변경한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="528" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">상태 변경을 하나의 스레드에 모은다</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">여러 요청은 큐로 전달하고, 상태 변경은 하나의 스레드가 맡는다</text>
<rect x="32" y="135" width="220" height="64" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="142.0" y="175.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">요청 스레드 A</text><rect x="32" y="226" width="220" height="64" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="142.0" y="266.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">요청 스레드 B</text><rect x="32" y="317" width="220" height="64" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="142.0" y="357.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">요청 스레드 C</text><path d="M252 167 L314 257" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><path d="M252 258 L314 258" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><path d="M252 349 L314 259" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="329" y="210" width="205" height="96" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="431.5" y="250.0" font-size="23" fill="#172b45" font-weight="600" text-anchor="middle">작업 큐</text><text x="431.5" y="282.0" font-size="23" fill="#172b45" font-weight="600" text-anchor="middle">요청을 보관</text><path d="M534 258 L581 258" fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/><rect x="596" y="145" width="272" height="226" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="732.0" y="218.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">상태 관리 스레드</text><text x="732.0" y="250.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">큐에서 작업을 꺼냄</text><text x="732.0" y="282.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">→ 상태를 읽고 변경</text><text x="732.0" y="314.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">상태는 여기서만 변경</text><rect x="32" y="414" width="836" height="88" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="451" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">공유 상태를 직접 만지는 실행 주체를 하나로 제한한다.</text><text x="54" y="483" font-size="21" fill="#235ab9" font-weight="400" text-anchor="start">큐에 넣는 스레드는 상태를 변경하지 않고, 작업 요청만 전달한다.</text></g></svg>