<svg xmlns="http://www.w3.org/2000/svg" width="900" height="557" viewBox="0 0 900 557" role="img" aria-labelledby="title desc">
<title id="title">두 번의 증가가 한 번만 반영된다</title><desc id="desc">A와 B가 각각 5를 읽은 뒤 6을 기록한다. 두 번 증가했지만 최종 값은 6이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="557" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">두 번의 증가가 한 번만 반영된다</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">count = count + 1은 읽기와 쓰기가 분리된다</text>
<rect x="32" y="111" width="836" height="52" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="58" y="146" font-size="21" fill="#52657a" font-weight="600" text-anchor="start">순서</text><text x="215" y="146" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">요청 A</text><text x="489" y="146" font-size="23" fill="#087e80" font-weight="600" text-anchor="start">요청 B</text><text x="749" y="146" font-size="21" fill="#52657a" font-weight="600" text-anchor="start">저장값</text><path d="M32 227 L868 227" fill="none" stroke="#d7e1ee" stroke-width="3"/><text x="69" y="204" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">1</text><text x="178" y="204" font-size="24" fill="#235ab9" font-weight="400" text-anchor="start">5를 읽음</text><text x="452" y="204" font-size="24" fill="#087e80" font-weight="400" text-anchor="start">—</text><text x="777" y="204" font-size="24" fill="#172b45" font-weight="700" text-anchor="start">5</text><path d="M32 291 L868 291" fill="none" stroke="#d7e1ee" stroke-width="3"/><text x="69" y="268" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">2</text><text x="178" y="268" font-size="24" fill="#235ab9" font-weight="400" text-anchor="start">—</text><text x="452" y="268" font-size="24" fill="#087e80" font-weight="400" text-anchor="start">5를 읽음</text><text x="777" y="268" font-size="24" fill="#172b45" font-weight="700" text-anchor="start">5</text><path d="M32 355 L868 355" fill="none" stroke="#d7e1ee" stroke-width="3"/><text x="69" y="332" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">3</text><text x="178" y="332" font-size="24" fill="#235ab9" font-weight="400" text-anchor="start">5 + 1을 저장</text><text x="452" y="332" font-size="24" fill="#087e80" font-weight="400" text-anchor="start">—</text><text x="777" y="332" font-size="24" fill="#172b45" font-weight="700" text-anchor="start">6</text><path d="M32 419 L868 419" fill="none" stroke="#d7e1ee" stroke-width="3"/><text x="69" y="396" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">4</text><text x="178" y="396" font-size="24" fill="#235ab9" font-weight="400" text-anchor="start">—</text><text x="452" y="396" font-size="24" fill="#087e80" font-weight="400" text-anchor="start">5 + 1을 저장</text><text x="777" y="396" font-size="24" fill="#172b45" font-weight="700" text-anchor="start">6</text><rect x="32" y="445" width="836" height="88" rx="12" fill="#eef4ff" stroke="#eef4ff" stroke-width="2"/><text x="54" y="482" font-size="23" fill="#235ab9" font-weight="600" text-anchor="start">두 요청이 같은 값을 읽으면, 나중 쓰기가 앞선 결과를 덮어쓴다.</text><text x="54" y="514" font-size="21" fill="#235ab9" font-weight="400" text-anchor="start">초기값 5 → 기대값 7 / 실제값 6</text></g></svg>