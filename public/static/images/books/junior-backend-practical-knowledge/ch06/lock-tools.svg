<svg xmlns="http://www.w3.org/2000/svg" width="900" height="579" viewBox="0 0 900 579" role="img" aria-labelledby="title desc">
<title id="title">접근을 제어하는 세 가지 도구</title><desc id="desc">상호 배제 잠금, 세마포어, 읽기 쓰기 잠금의 접근 허용 범위를 비교한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="579" rx="18" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="47" font-size="29" fill="#172b45" font-weight="700" text-anchor="start">접근을 제어하는 세 가지 도구</text><text x="32" y="83" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">잠금은 진입을 1개로, 세마포어는 지정한 개수로 제한한다</text>
<rect x="32" y="123" width="836" height="116" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="54" y="159" font-size="25" fill="#172b45" font-weight="600" text-anchor="start">상호 배제 잠금</text><text x="54" y="195" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">공유 자원에 한 번에 하나만 접근</text><rect x="583" y="151" width="72" height="56" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="619.0" y="187.0" font-size="23" fill="#235ab9" font-weight="600" text-anchor="middle">A</text><rect x="675" y="151" width="72" height="56" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="711.0" y="187.0" font-size="23" fill="#52657a" font-weight="600" text-anchor="middle">B</text><rect x="767" y="151" width="72" height="56" rx="12" fill="#f5f7fa" stroke="#d7e1ee" stroke-width="2"/><text x="803.0" y="187.0" font-size="23" fill="#52657a" font-weight="600" text-anchor="middle">C</text><rect x="32" y="259" width="836" height="116" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="54" y="295" font-size="25" fill="#172b45" font-weight="600" text-anchor="start">세마포어 · 허용 수 5</text><text x="54" y="331" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">동시에 실행할 작업 수를 제한</text><rect x="583" y="287" width="48" height="56" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="607.0" y="323.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">A</text><rect x="635" y="287" width="48" height="56" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="659.0" y="323.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">B</text><rect x="687" y="287" width="48" height="56" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="711.0" y="323.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">C</text><rect x="739" y="287" width="48" height="56" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="763.0" y="323.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">D</text><rect x="791" y="287" width="48" height="56" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="815.0" y="323.0" font-size="23" fill="#087e80" font-weight="600" text-anchor="middle">E</text><rect x="32" y="395" width="836" height="116" rx="12" fill="white" stroke="#d7e1ee" stroke-width="2"/><text x="54" y="431" font-size="25" fill="#172b45" font-weight="600" text-anchor="start">읽기 / 쓰기 잠금</text><text x="54" y="467" font-size="21" fill="#52657a" font-weight="400" text-anchor="start">읽기는 함께, 쓰기는 단독으로 실행</text><rect x="583" y="409" width="256" height="42" rx="12" fill="#eef4ff" stroke="#d7e1ee" stroke-width="2"/><text x="711.0" y="438.0" font-size="21" fill="#235ab9" font-weight="600" text-anchor="middle">읽기 A + 읽기 B</text><rect x="583" y="461" width="256" height="36" rx="12" fill="#e9f7f5" stroke="#d7e1ee" stroke-width="2"/><text x="711.0" y="487.0" font-size="18" fill="#087e80" font-weight="600" text-anchor="middle">쓰기 중에는 다른 접근 대기</text><text x="32" y="550" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">같은 자원을 다루는 코드가 같은 잠금 규칙을 따라야 한다.</text></g></svg>