<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">계층마다 맡은 역할과 의존 방향을 정한다</title><desc id="desc">표현, 응용, 도메인, 인프라의 네 계층을 하향 의존으로 구성한 예다. 업무 규칙은 도메인에 모은다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="610" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">계층마다 맡은 역할과 의존 방향을 정한다</text>
<text x="450" y="90" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">아래는 바로 하위 계층에 의존하는 구성의 예다.</text><rect x="90" y="124" width="720" height="82" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="230" y="173" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">표현</text><text x="345" y="173" font-size="24" fill="#235ab9" text-anchor="start" font-weight="400">요청 해석 · 응답 생성</text><path d="M230 206V227" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="235" width="720" height="82" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="230" y="284" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">응용</text><text x="345" y="284" font-size="24" fill="#235ab9" text-anchor="start" font-weight="400">사용 사례의 실행 순서 조율</text><path d="M230 317V338" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="346" width="720" height="82" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="230" y="395" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">도메인</text><text x="345" y="395" font-size="24" fill="#087e80" text-anchor="start" font-weight="400">취소 조건 · 상태 변경 규칙</text><path d="M230 428V449" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="457" width="720" height="82" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="230" y="506" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">인프라</text><text x="345" y="506" font-size="24" fill="#94600c" text-anchor="start" font-weight="400">DB 접근 · 외부 연동 구현</text><text x="450" y="581" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">도메인 규칙이 컨트롤러와 SQL에 흩어지지 않게 살핀다.</text>
</g></svg>
