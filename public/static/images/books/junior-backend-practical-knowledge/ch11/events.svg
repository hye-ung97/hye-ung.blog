<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">이벤트로 이미 일어난 사실을 전달한다</title><desc id="desc">생산자가 예약 확정 이벤트를 브로커에 발행한다. 브로커가 관심 있는 이용 준비와 알림 소비자에 전달한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="420" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">이벤트로 이미 일어난 사실을 전달한다</text>
<text x="450" y="90" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">생산자는 개별 소비자를 직접 호출하지 않는다.</text><rect x="32" y="190" width="210" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="137" y="226" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">이벤트 생산자</text><text x="137" y="258" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">예약 서비스</text><rect x="350" y="190" width="200" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="450" y="226" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">이벤트 브로커</text><text x="450" y="258" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">전달 · 라우팅</text><rect x="666" y="126" width="202" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="767" y="162" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">이벤트 소비자</text><text x="767" y="194" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">이용 준비</text><rect x="666" y="274" width="202" height="92" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="767" y="310" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">이벤트 소비자</text><text x="767" y="342" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">확정 알림</text><path d="M242 240H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="297" y="170" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">예약 확정됨</text><path d="M550 240H604V172H658" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M604 240V320H658" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="393" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">처리 완료 여부를 추적하려면 별도 관찰 수단이 필요하다.</text>
</g></svg>
