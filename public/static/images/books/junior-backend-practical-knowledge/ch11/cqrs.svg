<svg xmlns="http://www.w3.org/2000/svg" width="900" height="434" viewBox="0 0 900 434" role="img" aria-labelledby="title desc">
<title id="title">CQRS: 변경과 조회에 맞는 모델을 따로 둔다</title><desc id="desc">변경 요청은 명령 모델을 거쳐 DB를 수정하고, 조회 모델은 같은 DB에서 화면에 필요한 데이터를 읽는다. 별도 DB는 필수가 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="434" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">CQRS: 변경과 조회에 맞는 모델을 따로 둔다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">하나의 DB를 공유하면서 모델만 분리할 수도 있다.</text><rect x="32" y="132" width="180" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="122" y="182" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">변경 요청</text><rect x="32" y="293" width="180" height="84" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="122" y="343" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">조회 요청</text><rect x="305" y="132" width="240" height="84" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="425" y="168" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">명령 모델</text><text x="425" y="200" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">규칙 검증 · 상태 변경</text><rect x="305" y="293" width="240" height="84" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="425" y="329" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">조회 모델</text><text x="425" y="361" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">화면에 필요한 데이터</text><rect x="705" y="207" width="163" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="786.5" y="243" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">공유 DB</text><text x="786.5" y="275" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">저장소</text><path d="M212 174H297" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M212 335H297" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M545 174H786V199" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="623" y="154" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">쓰기</text><path d="M786 307V335H553" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="624" y="365" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">읽기</text>
</g></svg>
