<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">MVC: 요청 처리와 결과 표현을 나눈다</title><desc id="desc">컨트롤러가 요청을 해석해 모델을 실행하고 뷰를 선택한다. 모델은 업무 로직을, 뷰는 응답 생성을 맡는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="470" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">MVC: 요청 처리와 결과 표현을 나눈다</text>
<text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">모델은 HTML이나 화면 이동을 알 필요가 없다.</text><rect x="32" y="177" width="168" height="100" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="116" y="213" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">사용자</text><text x="116" y="245" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">요청 · 응답</text><rect x="302" y="143" width="218" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="411" y="179" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">컨트롤러</text><text x="411" y="211" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">입력 해석 · 흐름 제어</text><rect x="650" y="143" width="218" height="100" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="759" y="179" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">모델</text><text x="759" y="211" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">업무 로직 실행</text><rect x="302" y="323" width="218" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="411" y="359" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">뷰</text><text x="411" y="391" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">HTML · JSON 생성</text><path d="M200 205H294" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="248" y="185" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">① 요청</text><path d="M520 193H642" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="583" y="173" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">② 실행</text><path d="M411 243V315" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="435" y="284" font-size="21" fill="#52657a" text-anchor="start" font-weight="400">③ 선택 · 데이터 전달</text><path d="M302 373H116V285" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="187" y="401" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">④ 응답</text>
</g></svg>
