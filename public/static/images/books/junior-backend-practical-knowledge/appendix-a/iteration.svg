<svg xmlns="http://www.w3.org/2000/svg" width="900" height="418" viewBox="0 0 900 418" role="img" aria-labelledby="title desc">
<title id="title">실행하고, 원인을 찾고, 같은 조건에서 비교한다</title><desc id="desc">부하 실행, 지표 수집과 병목 분석, 원인 수정, 동일 조건 재측정을 반복한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="418" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">실행하고, 원인을 찾고, 같은 조건에서 비교한다</text>
<rect x="50" y="125" width="330" height="90" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="215" y="161" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">1. 부하 실행</text><text x="215" y="193" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">정한 시나리오 · 목표 부하</text><rect x="520" y="125" width="330" height="90" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="685" y="161" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">2. 지표와 병목 분석</text><text x="685" y="193" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">대상 서버 · DB · 부하기</text><rect x="520" y="280" width="330" height="90" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="685" y="316" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">3. 원인 수정</text><text x="685" y="348" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">병목에 맞는 개선 적용</text><rect x="50" y="280" width="330" height="90" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="215" y="316" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">4. 동일 조건 재측정</text><text x="215" y="348" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">목표 충족 여부 비교</text><path d="M380 170H512" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M685 215V272" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 325H388" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M215 280V223" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="89" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">목표 성능을 얻을 때까지 측정과 분석을 반복한다.</text>
</g></svg>
