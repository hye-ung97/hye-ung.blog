<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-labelledby="title desc">
<title id="title">부하를 만드는 장비와 처리하는 장비를 나눈다</title><desc id="desc">독립 부하 발생기가 테스트 대상에 요청을 보내며, 외부 연동은 대역으로 대체한다. 대상의 자원과 응답 지표를 함께 수집한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="428" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">부하를 만드는 장비와 처리하는 장비를 나눈다</text>
<rect x="32" y="142" width="222" height="100" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="143" y="178" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">부하 발생기</text><text x="143" y="210" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">독립 장비</text><rect x="350" y="142" width="218" height="100" rx="13" fill="#e9f7f4" stroke="#cbd7e5"/><text x="459" y="178" font-size="25" fill="#087e80" text-anchor="middle" font-weight="600">테스트 대상</text><text x="459" y="210" font-size="21" fill="#087e80" text-anchor="middle" font-weight="400">운영과 유사한 구성</text><rect x="665" y="142" width="203" height="100" rx="13" fill="#fff4df" stroke="#cbd7e5"/><text x="766.5" y="178" font-size="25" fill="#94600c" text-anchor="middle" font-weight="600">외부 연동 대역</text><text x="766.5" y="210" font-size="21" fill="#94600c" text-anchor="middle" font-weight="400">실제 서비스 대신</text><path d="M254 192H342" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="301" y="127" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">요청</text><path d="M568 192H657" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="615" y="127" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">연동</text><path d="M459 242V305" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M143 242V352H192" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="200" y="313" width="600" height="78" rx="13" fill="#eef4ff" stroke="#cbd7e5"/><text x="500" y="349" font-size="25" fill="#235ab9" text-anchor="middle" font-weight="600">지표 수집</text><text x="500" y="381" font-size="21" fill="#235ab9" text-anchor="middle" font-weight="400">응답 시간 · 처리량 · 오류율 · CPU · 메모리</text><text x="450" y="87" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">외부 서비스에 시험 부하가 전달되지 않게 구성한다.</text>
</g></svg>
