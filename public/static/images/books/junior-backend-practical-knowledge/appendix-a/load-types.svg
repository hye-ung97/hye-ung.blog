<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="title desc">
<title id="title">부하가 늘어도 처리량이 계속 늘지는 않는다</title><desc id="desc">부하가 증가하면 처리량이 늘다가 포화점에 도달한다. 한계를 넘어서면 처리량이 감소할 수 있다. 실측값이 없는 개념도다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker></defs>
<rect width="900" height="445" rx="18" fill="#fff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="32" y="49" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">부하가 늘어도 처리량이 계속 늘지는 않는다</text>
<text x="450" y="88" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">개념도 · 실제 측정값이 아닌 처리량 변화의 예</text><rect x="591" y="126" width="244" height="232" rx="10" fill="#fff4df"/><path d="M84 358H850" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M84 358V125" fill="none" stroke="#52657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="41" y="124" font-size="22" fill="#52657a" text-anchor="start" font-weight="400">처리량</text><text x="815" y="393" font-size="22" fill="#52657a" text-anchor="start" font-weight="400">부하 →</text><path d="M105 338C220 300 295 225 392 186C480 150 535 150 590 150C650 150 730 210 815 315" fill="none" stroke="#087e80" stroke-width="5"/><path d="M590 150V358" stroke="#52657a" stroke-width="2" stroke-dasharray="7 5"/><circle cx="590" cy="150" r="7" fill="#087e80"/><text x="568" y="127" font-size="23" fill="#087e80" text-anchor="end" font-weight="600">포화점</text><text x="712" y="178" font-size="24" fill="#94600c" text-anchor="middle" font-weight="600">버클존</text><text x="450" y="423" font-size="21" fill="#52657a" text-anchor="middle" font-weight="400">목표에 못 미치면 병목을 찾고 개선한 뒤 다시 측정한다.</text>
</g></svg>
