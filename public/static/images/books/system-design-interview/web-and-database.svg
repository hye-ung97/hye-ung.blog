<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">요청 분산과 데이터베이스 복제</title><desc id="desc">로드밸런서가 웹 서버 두 대로 요청을 나눈다. 각 웹 서버는 주 DB에 쓰고 부 DB에서 읽는다. 데이터는 주 DB에서 부 DB로 복제된다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8190a7"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315eb8"/></marker></defs>
<rect x="1" y="1" width="1038" height="648" rx="20" fill="#f7f9fc" stroke="#d8e1ee"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><text x="40" y="51" text-anchor="start" font-size="26" font-weight="700" fill="#22324a">요청 분산과 데이터베이스 복제</text><path d="M520 146 V194" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M520 258 V290 H290 V326" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M520 258 V290 H750 V326" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M270 398 V492" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M310 398 L710 492" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M730 398 L330 492" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M770 398 V492" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="400" y="86" width="240" height="60" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="520.0" y="124.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">사용자</text><rect x="400" y="194" width="240" height="64" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="520.0" y="234.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">로드밸런서</text><rect x="170" y="326" width="240" height="72" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="290.0" y="370.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버 1</text><rect x="630" y="326" width="240" height="72" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="750.0" y="370.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버 2</text><text x="520" y="177" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">HTTP 요청</text><text x="520" y="316" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">정상인 웹 서버로 요청 분산</text><rect x="150" y="492" width="280" height="76" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="290.0" y="527.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">주 DB</text><text x="290.0" y="556.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">추가 · 수정 · 삭제</text><rect x="610" y="492" width="280" height="76" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="750.0" y="527.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">부 DB</text><text x="750.0" y="556.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">조회</text><path d="M430 531 H610" fill="none" stroke="#315eb8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="520" y="515" text-anchor="middle" font-size="18" font-weight="500" fill="#315eb8">데이터 복제</text><text x="520" y="613" text-anchor="middle" font-size="20" font-weight="500" fill="#61718a">쓰기와 읽기를 나누고, 같은 데이터의 사본을 둔다.</text></g></svg>
