<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="797" viewBox="0 0 1040 797" role="img" aria-labelledby="title desc">
<title id="title">캐시와 CDN은 어디에서 동작할까</title><desc id="desc">위쪽은 웹 서버가 캐시를 확인하고 없으면 DB를 조회한 뒤 캐시에 저장하는 흐름이다. 아래쪽은 사용자가 CDN에서 정적 파일을 받고, 캐시 미스일 때 CDN이 원본 서버에서 가져오는 흐름이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8190a7"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315eb8"/></marker></defs>
<rect x="1" y="1" width="1038" height="795" rx="20" fill="#f7f9fc" stroke="#d8e1ee"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><text x="40" y="51" text-anchor="start" font-size="26" font-weight="700" fill="#22324a">캐시와 CDN은 어디에서 동작할까</text><text x="40" y="99" text-anchor="start" font-size="20" font-weight="700" fill="#315eb8">데이터 캐시</text><text x="40" y="127" text-anchor="start" font-size="20" font-weight="500" fill="#61718a">웹 서버가 조회 결과를 재사용한다.</text><rect x="70" y="180" width="240" height="80" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="190.0" y="228.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버</text><rect x="730" y="180" width="240" height="80" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="850.0" y="228.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">캐시</text><rect x="400" y="360" width="240" height="70" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="520.0" y="403.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">DB</text><path d="M310 207 H730" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="520" y="195" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">① 캐시 확인</text><path d="M730 242 H310" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="520" y="280" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">적중하면 바로 반환</text><path d="M150 260 V395 H400" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="175" y="311" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">② 없으면</text><text x="175" y="337" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">DB 조회</text><path d="M400 375 H290 V260" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="385" y="336" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">조회 결과</text><path d="M190 180 V153 H850 V180" fill="none" stroke="#315eb8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="520" y="144" text-anchor="middle" font-size="18" font-weight="500" fill="#315eb8">③ 조회 후 캐시 저장</text><text x="520" y="455" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">DB에서 읽어 캐시에 채우는 주체는 웹 서버다.</text><path d="M40 475 H1000" stroke="#d8e1ee" stroke-width="2"/><text x="40" y="520" text-anchor="start" font-size="20" font-weight="700" fill="#315eb8">CDN</text><text x="40" y="548" text-anchor="start" font-size="20" font-weight="500" fill="#61718a">사용자가 정적 파일을 가까운 CDN에서 받는다.</text><rect x="60" y="599" width="220" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="170.0" y="648.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">사용자</text><rect x="410" y="599" width="220" height="82" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="520.0" y="648.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">CDN</text><rect x="760" y="599" width="220" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="870.0" y="648.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">원본 서버</text><path d="M280 619 H410" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="345" y="607" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">요청</text><path d="M410 661 H280" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="345" y="705" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">파일 반환</text><path d="M630 619 H760" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="7 7"/><text x="695" y="582" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">캐시 미스 시</text><text x="695" y="607" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">원본 요청</text><path d="M760 661 H630" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="7 7"/><text x="695" y="705" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">파일 수신·캐시</text><text x="520" y="759" text-anchor="middle" font-size="20" font-weight="500" fill="#61718a">CDN에 파일이 있으면 원본에 요청하지 않고 응답한다.</text></g></svg>
