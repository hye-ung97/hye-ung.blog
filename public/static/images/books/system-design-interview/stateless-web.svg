<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="725" viewBox="0 0 1040 725" role="img" aria-labelledby="title desc">
<title id="title">무상태 웹 계층: 상태 정보의 위치를 바꾼다</title><desc id="desc">웹 서버에 세션을 보관하면 같은 서버로 요청을 보내야 한다. 공유 저장소로 세션을 옮기면 어느 웹 서버든 동일한 상태에 접근할 수 있다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8190a7"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315eb8"/></marker></defs>
<rect x="1" y="1" width="1038" height="723" rx="20" fill="#f7f9fc" stroke="#d8e1ee"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><text x="40" y="51" text-anchor="start" font-size="26" font-weight="700" fill="#22324a">무상태 웹 계층: 상태 정보의 위치를 바꾼다</text><text x="40" y="103" text-anchor="start" font-size="20" font-weight="700" fill="#315eb8">상태가 웹 서버 안에 있을 때</text><rect x="75" y="150" width="230" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="190.0" y="199.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">사용자 A</text><rect x="425" y="150" width="250" height="82" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="550.0" y="188.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">웹 서버 1</text><text x="550.0" y="217.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">사용자 A의 세션</text><rect x="750" y="150" width="215" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="857.5" y="188.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버 2</text><text x="857.5" y="217.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">A의 세션 없음</text><path d="M305 191 H425" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="365" y="173" text-anchor="middle" font-size="18" font-weight="500" fill="#61718a">같은 서버로</text><text x="520" y="280" text-anchor="middle" font-size="20" font-weight="500" fill="#61718a">세션이 저장된 서버에 요청을 계속 보내야 한다.</text><path d="M40 319 H1000" stroke="#d8e1ee" stroke-width="2"/><text x="40" y="368" text-anchor="start" font-size="20" font-weight="700" fill="#315eb8">상태를 공유 저장소로 옮기면</text><rect x="75" y="470" width="230" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="190.0" y="519.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">사용자 A</text><rect x="425" y="415" width="250" height="72" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="550.0" y="459.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버 1</text><rect x="425" y="559" width="250" height="72" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="550.0" y="603.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">웹 서버 2</text><rect x="755" y="482" width="220" height="82" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="865.0" y="520.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">공유 저장소</text><text x="865.0" y="549.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">사용자 A의 세션</text><path d="M305 511 H360 V451 H425" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M360 511 V595 H425" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M675 451 H715 V503 H755" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M675 595 H715 V543 H755" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="520" y="526" text-anchor="middle" font-size="20" font-weight="500" fill="#315eb8">어느 서버든 처리</text><text x="520" y="687" text-anchor="middle" font-size="20" font-weight="500" fill="#61718a">상태는 남아 있고, 개별 웹 서버에서 분리된다.</text></g></svg>
