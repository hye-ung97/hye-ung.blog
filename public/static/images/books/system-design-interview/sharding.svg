<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="631" viewBox="0 0 1040 631" role="img" aria-labelledby="title desc">
<title id="title">샤딩: 데이터 자체를 나누어 저장한다</title><desc id="desc">사용자 ID를 4로 나눈 나머지로 네 샤드 중 하나를 선택한다. 샤드마다 서로 다른 사용자의 데이터가 저장된다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8190a7"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315eb8"/></marker></defs>
<rect x="1" y="1" width="1038" height="629" rx="20" fill="#f7f9fc" stroke="#d8e1ee"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><text x="40" y="51" text-anchor="start" font-size="26" font-weight="700" fill="#22324a">샤딩: 데이터 자체를 나누어 저장한다</text><rect x="365" y="99" width="310" height="82" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="520.0" y="137.0" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">사용자 데이터</text><text x="520.0" y="166.0" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">샤딩 키: user_id</text><path d="M520 181 V226" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="365" y="226" width="310" height="64" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="520.0" y="266.0" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">user_id % 4</text><path d="M520 290 V341 H149 M520 341 H893" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round"/><path d="M149 341 V397" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="149" y="377" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">나머지 0</text><rect x="44" y="397" width="210" height="151" rx="14" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/><text x="149.0" y="469.5" text-anchor="middle" font-size="24" font-weight="650" fill="#315eb8">샤드 0</text><text x="149.0" y="498.5" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">0, 4, 8, 12</text><path d="M397 341 V397" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="397" y="377" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">나머지 1</text><rect x="292" y="397" width="210" height="151" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="397.0" y="469.5" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">샤드 1</text><text x="397.0" y="498.5" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">1, 5, 9, 13</text><path d="M645 341 V397" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="645" y="377" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">나머지 2</text><rect x="540" y="397" width="210" height="151" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="645.0" y="469.5" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">샤드 2</text><text x="645.0" y="498.5" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">2, 6, 10, 14</text><path d="M893 341 V397" fill="none" stroke="#8190a7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="893" y="377" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">나머지 3</text><rect x="788" y="397" width="210" height="151" rx="14" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/><text x="893.0" y="469.5" text-anchor="middle" font-size="24" font-weight="650" fill="#22324a">샤드 3</text><text x="893.0" y="498.5" text-anchor="middle" font-size="19" font-weight="500" fill="#61718a">3, 7, 11, 15</text><text x="520" y="594" text-anchor="middle" font-size="20" font-weight="500" fill="#61718a">같은 스키마를 쓰되, 저장하는 데이터는 나누어 가진다.</text></g></svg>
