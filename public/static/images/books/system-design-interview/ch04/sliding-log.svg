<text x="36" y="84" font-size="21" font-weight="500" fill="#61718a" text-anchor="start">한도: 최근 1분에 2회 · 거절된 요청의 시각도 로그에 남긴다</text>
<rect x="40" y="120" width="440" height="335" rx="12" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
