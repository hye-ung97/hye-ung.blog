<text x="562" y="718" font-size="23" font-weight="600" fill="#315eb8" text-anchor="start">1:01:40</text>
<text x="740" y="797" font-size="21" font-weight="650" fill="#24775c" text-anchor="middle">만료된 두 기록 삭제 · 2개 남음</text>
<text x="500" y="895" font-size="22" font-weight="500" fill="#61718a" text-anchor="middle">1:01:40에는 1:00:40보다 오래된 기록이 만료된다.</text>
