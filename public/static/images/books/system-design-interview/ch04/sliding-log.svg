<rect x="40" y="495" width="440" height="335" rx="12" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
<text x="62" y="537" font-size="24" font-weight="700" fill="#315eb8" text-anchor="start">03  1:00:50</text>
