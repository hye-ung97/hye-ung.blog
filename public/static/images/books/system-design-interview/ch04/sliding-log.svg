<path d="M554 630 H673" fill="none" stroke="#61718a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="702" y="638" font-size="20" font-weight="500" fill="#61718a" text-anchor="start">만료</text>
<text x="562" y="678" font-size="23" font-weight="600" fill="#986a14" text-anchor="start">1:00:50</text>
