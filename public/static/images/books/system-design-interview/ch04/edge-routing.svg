<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">사용자와 가까운 에지 서버로 트래픽을 보낸다</title><desc id="desc">분산된 에지 서버 중 사용자와 가까운 서버로 요청을 전달한다. 사용자 한 곳과 에지 서버 열두 곳을 표시하고, 가까운 서버로 향하는 경로를 강조한다.</desc>
