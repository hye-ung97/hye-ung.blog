<text x="500" y="619" font-size="21" font-weight="600" fill="#61718a" text-anchor="start">초과 요청의 처리</text>
<text x="280" y="679" font-size="21" font-weight="650" fill="#b53d49" text-anchor="end">옵션 1</text>
<text x="720" y="679" font-size="21" font-weight="650" fill="#315eb8" text-anchor="start">옵션 2</text>
<rect x="180" y="702" width="250" height="78" rx="12" fill="#fff1f2" stroke="#b53d49" stroke-width="2"/>
<text x="305.0" y="749.0" font-size="23" font-weight="650" fill="#b53d49" text-anchor="middle">요청 버림</text>
<rect x="570" y="702" width="250" height="78" rx="12" fill="#edf3ff" stroke="#315eb8" stroke-width="2"/>
<text x="695.0" y="749.0" font-size="23" font-weight="650" fill="#315eb8" text-anchor="middle">메시지 큐에 보관</text>
<text x="500" y="812" font-size="21" font-weight="500" fill="#61718a" text-anchor="middle">429는 응답 경로 · 버림과 큐 보관은 요청 처리 선택</text>
</g></svg>