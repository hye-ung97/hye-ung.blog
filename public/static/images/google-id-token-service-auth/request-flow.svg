<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">서버 간 Google ID token 인증 흐름</title>
  <desc id="desc">호출 서버가 audience를 지정해 Google에 토큰을 요청하고 발급받은 뒤, 파일 처리 서비스에 Bearer 토큰을 보냅니다. 수신 서비스가 토큰과 허용 계정을 확인합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#335b77" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1120" height="660" rx="18" fill="#f8fafc"/>
  <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" fill="#183247">
    <text x="50" y="58" font-size="29" font-weight="700">서버 요청에 실행 신원을 담기</text>
    <text x="50" y="93" font-size="19" fill="#52677a">Google이 서명한 토큰을 수신 서비스에서 검증한다</text>
    <g font-size="23" font-weight="600" text-anchor="middle">
      <rect x="68" y="133" width="236" height="67" rx="12" fill="#e0edf7" stroke="#b8d0e4"/>
      <text x="186" y="176">호출하는 서버</text>
      <rect x="442" y="133" width="236" height="67" rx="12" fill="#e8eef4" stroke="#c5d0dc"/>
      <text x="560" y="176">Google</text>
      <rect x="816" y="133" width="236" height="67" rx="12" fill="#ddf0ed" stroke="#b0d5ce"/>
      <text x="934" y="176">파일 처리 서비스</text>
    </g>
    <g stroke="#c6d2dd" stroke-width="2" stroke-dasharray="6 7">
      <path d="M186 210V558"/><path d="M560 210V558"/><path d="M934 210V558"/>
    </g>
    <g stroke="#335b77" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M186 276H556"/>
      <path d="M560 361H190"/>
      <path d="M186 451H930"/>
    </g>
    <g font-size="20" text-anchor="middle">
      <rect x="211" y="235" width="324" height="29" fill="#f8fafc"/>
      <text x="373" y="256">① audience를 지정해 토큰 요청</text>
      <rect x="218" y="320" width="310" height="29" fill="#f8fafc"/>
      <text x="373" y="341">② Google이 서명한 ID token</text>
      <rect x="305" y="409" width="510" height="29" fill="#f8fafc"/>
      <text x="560" y="430">③ Authorization: Bearer &lt;ID token&gt;</text>
    </g>
    <rect x="713" y="480" width="366" height="91" rx="11" fill="#e7f3f0" stroke="#b0d5ce"/>
    <text x="896" y="513" text-anchor="middle" font-size="20" font-weight="600">④ 서명 · iss · aud · exp 확인</text>
    <text x="896" y="546" text-anchor="middle" font-size="20">허용한 서비스 계정인지 확인</text>
    <text x="50" y="620" font-size="18" fill="#52677a">발급과 검증을 단순화한 흐름 · 호출 측의 토큰 재사용과 갱신은 인증 라이브러리가 관리</text>
  </g>
</svg>
